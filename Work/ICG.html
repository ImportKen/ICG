function multiplyMatrix(matrixA, matrixB) {
  const rowsA = matrixA.length;
  const columnsA = matrixA[0].length;
  const rowsB = matrixB.length;
  const columnsB = matrixB[0].length;

  if (columnsA !== rowsB) {
    throw new Error('จำนวน column ของ matrixA ต้องเท่ากับจำนวน row ของ matrixB');
  }

  const result = Array.from(
    { length: rowsA },
    () => Array(columnsB).fill(0)
  );

  for (let row = 0; row < rowsA; row++) {
    for (let column = 0; column < columnsB; column++) {
      for (let k = 0; k < columnsA; k++) {
        result[row][column] += matrixA[row][k] * matrixB[k][column];
      }
    }
  }

  return result;
}

function putPixel(x, y, r, g, b, a = 255) {
  const idx = (y * canvas.width + x) * 4; // หา index แรกของ pixel (x,y)
  pixels[idx] = r;
  pixels[idx + 1] = g;
  pixels[idx + 2] = b;
  pixels[idx + 3] = a;
}

function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawRect(x1, y1, x2, y2, r, g, b, a = 255) {
  drawLine(x1, y1, x2, y1, r, g, b, a); // Top edge
  drawLine(x2, y1, x2, y2, r, g, b, a); // Right edge
  drawLine(x2, y2, x1, y2, r, g, b, a); // Bottom edge
  drawLine(x1, y2, x1, y1, r, g, b, a); // Left edge
}

function drawRectFilled(x1, y1, x2, y2, r, g, b, a = 255) {
  for (let y = y1; y <= y2; y++) {
    for (let x = x1; x <= x2; x++) {
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawRectGradient(x1, y1, x2, y2, r1, g1, b1, r2, g2, b2) {
  for (let y = y1; y <= y2; y++) {
    const t = (y - y1) / (y2 - y1);
    const r = Math.round(r1 * (1 - t) + r2 * t);
    const g = Math.round(g1 * (1 - t) + g2 * t);
    const b = Math.round(b1 * (1 - t) + b2 * t);
    for (let x = x1; x <= x2; x++) {
      putPixel(x, y, r, g, b);
    }
  }
}

function drawEllipse(cx, cy, rx, ry, r, g, b, a = 255) {
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) < 1) {
        putPixel(cx + x, cy + y, r, g, b, a);
      }
    }
  }
}

function drawSprite(sprite, x, y, r, g, b, a = 255) {
  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      if (sprite[j][i] === 1) {
        putPixel(x + i, y + j, r, g, b, a);
      }
    }
  }
}

function drawSpriteRotationScale(sprite, x, y, degree, scaleX, scaleY, r, g, b, a = 255) {
  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      if (sprite[j][i] === 1) {

        // Translate to center
        const cX = i - sprite[j].length / 2;
        const cY = j - sprite.length / 2;

        // Rotate
        const rad = degree * Math.PI / 180;
        const x_rotated = Math.round(cX * Math.cos(rad) - cY * Math.sin(rad));
        const y_rotated = Math.round(cX * Math.sin(rad) + cY * Math.cos(rad));

        //Scale
        const x_rotated_scaled = Math.round(x_rotated * scaleX);
        const y_rotated_scaled = Math.round(y_rotated * scaleY);
        //putPixel(x_rotated_scaled + x, y_rotated_scaled + y, r, g, b, a);
        drawEllipse(x_rotated_scaled + x, y_rotated_scaled + y, Math.round(scaleX), Math.round(scaleY), r, g, b, a); // Draw a filled circle to represent the pixel
      }
    }
  }
}

function drawSprite24Bit(sprite, x, y) {
  
  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      const color = sprite[j][i];

      if (color !== null) {
        const r = (color >> 16) & 255;
        const g = (color >> 8) & 255;
        const b = color & 255;
        putPixel(x + i, y + j, r, g, b);
      }
    }
  }
}

function drawSprite24BitTranformMatrix(sprite, x, y,degree,scaleX, scaleY) {
  const radian = degree * (Math.PI / 180);
  const cos = Math.cos(radian);
  const sin = Math.sin(radian);

   // Scale matrix
  const scaleMatrix = [
    [scaleX, 0,      0],
    [0,      scaleY, 0],
    [0,      0,      1]
  ];

  // Rotation matrix
  const rotationMatrix = [
    [cos, -sin, 0],
    [sin,  cos, 0],
    [0,      0, 1]
  ];

  // Translation matrix
  const translationMatrix = [
    [1, 0, x],
    [0, 1, y],
    [0, 0, 1]
  ];

  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      const color = sprite[j][i];
      if (color !== null) {
        // Center the pixel coordinates
        const cX = i - (sprite[j].length / 2);
        const cY = j - (sprite.length / 2);

        let point = [[cX], [cY], [1]];
        point = multiplyMatrix(scaleMatrix, point);
        point = multiplyMatrix(rotationMatrix, point);
        point = multiplyMatrix(translationMatrix, point);

        const px = Math.round(point[0][0]);
        const py = Math.round(point[1][0]);

        const r = (color >> 16) & 255;
        const g = (color >> 8) & 255;
        const b = color & 255;

        putPixel(x + px, y + py, r, g, b);
      }
    }
  }
}

function drawSprite24BitAffineTransformMatrix(sprite, x, y,degree,scaleX, scaleY) {
  const radian = degree * (Math.PI / 180);
  const cos = Math.cos(radian);
  const sin = Math.sin(radian);

    const affineTransformMatrix = [
    [cos * scaleX, -sin * scaleY, x],
    [sin * scaleX-0.5,  cos * scaleY, y],
    [0,             0,            1]
  ];

  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      const color = sprite[j][i];
      if (color !== null) {
        // Center the pixel coordinates
        const cX = i - (sprite[j].length / 2);
        const cY = j - (sprite.length / 2);

        let point = [[cX], [cY], [1]];
        point = multiplyMatrix(affineTransformMatrix, point);

        const px = Math.round(point[0][0]);
        const py = Math.round(point[1][0]);

        const r = (color >> 16) & 255;
        const g = (color >> 8) & 255;
        const b = color & 255;

        putPixel(x + px, y + py, r, g, b);
      }
    }
  }
}

function toScaledMousePos(posX, posY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.floor((posX - rect.left) * scaleX),
    y: Math.floor((posY - rect.top) * scaleY)
  };
}

canvas.addEventListener('mousedown', (event) => { //ตอนกดเลย

    isDragging = true;

    lastX = x;

})

        mouseY = y;

        lastY = y;
        ctx.putImageData(imageData, 0, 0);}

window.addEventListener('keydown', (event) => {
    console.log('Key down', event.key);
    if(event.key === '1'){
      r = 255; g = 0; b = 0; // Red
    }
    if(event.key === '2'){
      r = 0; g = 255; b = 0; // Green
    }
    if(event.key === '3'){
      r = 0; g = 0; b = 255; // Blue
    }
    if(event.key === 'e'){
      r = 255; g = 255; b = 255; // White
    }
    if (event.key == 'ArrowLeft') {
        degree -= 5;
    }
    if (event.key == 'ArrowRight') {
        degree += 5;
    }
    if (event.key == 'ArrowUp') {
        Scale += 0.1;
    }
    if (event.key == 'ArrowDown') {
        Scale -= 0.1 ;
    }
});
