<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shader Starter • Fixed Light Angle</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
  // Scene / Camera / Renderer
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const camera = new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    100
  );
  camera.position.set(0, 0, 2.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  // ทิศทางแสงแบบคงที่ใน World Space
  const uniforms = {
    uTime: { value: 0.0 },
    uLightDir: { value: new THREE.Vector3(0.5, 1.0, 0.8).normalize() }
  };

  const vertexShader = `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPosition;

    void main() {
      vUv = uv;

      // 1. ดัดรูปทรงวัตถุด้วย Wave (sin)
      vec3 pos = position;
      pos.z += sin(pos.x * 5.0 + uTime) * 0.1;

      // 2. คำนวณ World Position และ World Normal (เพื่อล็อกแสงไว้กับพิกัดโลก ไม่ขึ้นกับกล้อง)
      vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
      vWorldPosition = worldPosition.xyz;
      
      // แปลง Normal ให้อยู่ใน World Space
      vWorldNormal = normalize(mat3(modelMatrix) * normal);

      gl_Position = projectionMatrix * viewMatrix * worldPosition;
    }
  `;

  const fragmentShader = `
    precision mediump float;

    uniform float uTime;
    uniform vec3 uLightDir;
    varying vec3 vWorldNormal;
    varying vec2 vUv;
    varying vec3 vWorldPosition;

    void main() {
      vec3 N = normalize(vWorldNormal);
      vec3 L = normalize(uLightDir);

      // 1. สีพื้นฐาน
      vec3 baseColor = vec3(1.0, 0.1, 0.1); 

      // 2. Diffuse (คำนวณใน World Space)
      float diffuse = max(dot(N, L), 0.0);
      float level = 40.0;
      diffuse = floor(diffuse * float(level)) / float(level);
      
      // 3. Ambient
      float ambient = 0.15; 
       
      // 4. Phong Specular Shading (คำนวณเทียบกับตำแหน่งกล้องใน World Space)
      vec3 R = reflect(-L, N);
      vec3 V = normalize(cameraPosition - vWorldPosition); 
      
      float specAngle = max(dot(R, V), 0.0);
      float shininess = 32.0;
      float specular = pow(specAngle, shininess);
      vec3 specularColor = vec3(1.0);

      // 5. รวมผลลัพธ์แสง
      vec3 finalColor = baseColor * (diffuse + ambient);

      gl_FragColor = vec4(finalColor, 1.0);
    }
  `;

  const geometry = new THREE.SphereBufferGeometry(0.8, 32, 32);
  const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

  function animate(time) {
    uniforms.uTime.value = time * 0.001;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
